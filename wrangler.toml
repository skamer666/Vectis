# Configuration Cloudflare Worker (ressource "legatis" -- voir CLOUDFLARE_MIGRATION.md
# a la racine du depot pour le guide de migration complet).
#
# IMPORTANT (decouvert lors du premier deploiement reel, 31.08.2026) : malgre
# le nom "Workers & Pages" et le chemin "Create -> Pages -> Connect to Git"
# suivi a la creation, la ressource creee dans le dashboard Cloudflare est un
# vrai WORKER (visible sous /workers/services/view/legatis/...), PAS un
# projet Cloudflare Pages classique. `wrangler pages deploy` echoue avec
# "The Pages project legatis does not exist" -- il faut deployer avec
# `wrangler deploy` (la commande normale pour un Worker) et fournir un point
# d'entree Worker (`main`) + un binding d'assets statiques, pas
# `pages_build_output_dir` (qui n'existe que pour un vrai projet Pages).
#
# functions/api/*.js reste ecrit selon la convention Cloudflare Pages
# Functions (fichiers, onRequest, context.env) -- inchange. La commande
# `wrangler pages functions build --outdir=dist/_worker.js/` (executee dans
# la commande de build du projet, voir CLOUDFLARE_MIGRATION.md) compile ces
# fonctions en un unique script Worker classique, sans reecrire leur logique
# -- c'est le pont officiel documente par Cloudflare pour ce cas de figure
# (Pages Functions + assets statiques deployes comme Worker). Verifie en
# local avec `npx wrangler pages functions build` : compile sans erreur,
# import statique des JSON generes par build.py bien inline dans le bundle.
#
# main pointe vers worker-entry.js (fichier statique du depot, PAS genere) :
# il importe dist/_worker.js/index.js (le script compile par
# `wrangler pages functions build`, regenere a chaque build) et y ajoute un
# gestionnaire "scheduled" que Pages Functions ne sait pas produire tout
# seul -- voir le commentaire en tete de worker-entry.js pour le detail.
# [assets] sert le reste de dist/ (le site statique de 73000+ pages) via le
# binding ASSETS -- .assetsignore (genere par gen_cloudflare_files() dans
# build.py) exclut _worker.js/ de l'upload en tant qu'asset statique.
#
# compatibility_flags = ["nodejs_compat"] reste CRITIQUE : sans lui,
# process.env, Buffer et node:crypto (utilises par functions/api/*.js, portes
# depuis les fonctions Vercel d'origine) ne fonctionnent pas dans le runtime
# Workers. Avec compatibility_date >= 2025-04-01, ce flag suffit a lui seul a
# peupler process.env depuis les variables d'environnement / secrets du
# Worker (pas besoin du flag separe nodejs_compat_populate_process_env,
# automatique a partir de cette date).
#
# [triggers] : cron quotidien du gestionnaire "scheduled" (relance avis, voir
# worker-entry.js) -- ajoute suite a l'arret complet de Vercel (01.09.2026),
# qui portait ce cron auparavant (vercel.json, desormais supprime).
name = "legatis"
main = "worker-entry.js"
compatibility_date = "2026-08-31"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 8 * * *"]

[assets]
directory = "dist"
binding = "ASSETS"
# not_found_handling = "404-page" : sert dist/404.html (genere par
# gen_404() dans build.py) avec un vrai statut HTTP 404 pour toute URL
# inconnue -- sans ca, Cloudflare renvoyait deja un 404 (verifie), mais
# avec un corps de page totalement vide (aucune navigation, impasse pour
# le visiteur). 404.html utilise des chemins absolus partout (images/CSS/
# liens) car il est servi tel quel a n'importe quelle profondeur d'URL,
# sans que la barre d'adresse ne change.
not_found_handling = "404-page"
# run_worker_first : sans ca, Cloudflare sert les fichiers statiques
# directement depuis la couche assets AVANT d'invoquer fetch() dans
# worker-entry.js -- decouvert le 02.09.2026 en debuggant pourquoi la
# redirection canonique (canonicalRedirect) ne s'executait jamais en prod
# malgre un deploiement et un cache purges corrects : la requete
# n'atteignait tout simplement jamais le code du Worker pour une page
# statique. Necessaire pour que la verification hostname/protocol tourne
# sur CHAQUE requete, quel que soit le chemin demande.
run_worker_first = true
