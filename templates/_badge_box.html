<div class="badge-box">
  <div class="badge-box-preview">
    <img src="{{ badge_svg_url }}" alt="{{ badge_alt }}" width="220" height="56" loading="lazy">
  </div>
  <div class="badge-box-copy">
    <p class="badge-box-title">{{ ui.badge_title }}</p>
    <p class="badge-box-text">{{ ui.badge_text }}</p>
    <textarea readonly class="badge-embed-code" rows="2" onclick="this.select()">{{ badge_embed_code }}</textarea>
    <p class="badge-box-text" style="margin-top:8px;"><a href="{{ claim_page_url }}">{{ ui.claim_page_link }}</a></p>
  </div>
</div>
