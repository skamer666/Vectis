{% extends "base.html" %}
{% block content %}
<div class="container">
  <section class="hero" style="padding-block:var(--space-2xl) var(--space-2xl);" data-reveal>
    <div class="hero-eyebrow">{{ ui.search_title }}</div>
    <h1>{{ ui.search_title }}</h1>
    <form class="search-box" id="search-form" onsubmit="return false;">
      <input type="text" id="search-input" name="q" placeholder="{{ ui.search_placeholder }}" autocomplete="off">
      <button type="submit">{{ ui.search_button }}</button>
    </form>
  </section>
  <section class="section" style="padding-top:0;">
    <p id="search-status" class="lede"></p>
    <div class="registry" id="search-results"></div>
  </section>
</div>
<script>
(function() {
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var status = document.getElementById('search-status');
  var noResultsText = {{ ui.no_results | tojson }};
  var resultsForText = {{ ui.search_results_for | tojson }};
  var indexUrl = {{ search_index_url | tojson }};
  var data = null;
  var debounceTimer = null;

  function normalize(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function highlight(text, query) {
    var safe = escapeHtml(text);
    if (!query) return safe;
    var normText = normalize(text);
    var normQuery = normalize(query);
    var idx = normText.indexOf(normQuery);
    if (idx === -1) return safe;
    return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>' + escapeHtml(text.slice(idx + query.length));
  }

  function render(query) {
    if (!data) return;
    var q = normalize(query);
    var matches = q ? data.filter(function(item) {
      return normalize(item.nom).indexOf(q) !== -1 ||
             normalize(item.etude || '').indexOf(q) !== -1 ||
             normalize(item.ville || '').indexOf(q) !== -1;
    }) : [];
    results.innerHTML = '';
    if (!q) { status.textContent = ''; return; }
    status.textContent = resultsForText + ' « ' + query + ' » (' + matches.length + ')';
    if (matches.length === 0) { status.textContent = noResultsText; return; }
    matches.slice(0, 100).forEach(function(item, i) {
      var a = document.createElement('a');
      a.className = 'registry-row';
      a.href = item.url;
      a.style.opacity = '0';
      a.style.transform = 'translateY(8px)';
      a.style.transition = 'opacity .35s cubic-bezier(0.16,1,0.3,1), transform .35s cubic-bezier(0.16,1,0.3,1)';
      a.style.transitionDelay = Math.min(i * 0.02, 0.3) + 's';
      a.innerHTML = '<div><div class="registry-name">' + highlight(item.nom, query) + '</div></div>' +
        '<div class="registry-firm">' + highlight(item.etude || '', query) + '</div>' +
        '<div class="registry-city">' + highlight(item.ville || '', query) + '</div>';
      results.appendChild(a);
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          a.style.opacity = '1';
          a.style.transform = 'translateY(0)';
        });
      });
    });
  }

  var params = new URLSearchParams(window.location.search);
  var initialQ = params.get('q') || '';
  input.value = initialQ;

  fetch(indexUrl).then(function(r) { return r.json(); }).then(function(json) {
    data = json;
    render(input.value);
  });

  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    var v = input.value;
    debounceTimer = setTimeout(function() { render(v); }, 80);
  });
  input.focus();
})();
</script>
{% endblock %}
